name: Generate Sponsor Graph

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone sponsor-graph tool
        run: |
          git clone https://github.com/Vendicated/github-sponsor-graph.git /tmp/sponsor-graph
          cd /tmp/sponsor-graph
          npm install

      - name: Generate sponsor graph
        env:
          GITHUB_TOKEN: ${{ secrets.SPONSOR_GRAPH_TOKEN }}
        run: |
          cd /tmp/sponsor-graph
          node generate-graph.js -o "${{ github.workspace }}/sponsors.png" -d
          cp "${{ github.workspace }}/sponsors.png" "${{ github.workspace }}/sponsors.png"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sponsors.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update sponsor graph"
            git push
          fi
